### M5 蒸馏：Qwen3-0.6B 学生（LoRA on 教师生成的多轮验证数据）
### 用法：llamafactory-cli train D:\MyCode\JChat\training\llamafactory_distill_0.6b.yaml

model_name_or_path: D:/MyCode/JChat/models/Qwen3-0.6B
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

