[project]
name = "jchat"
version = "0.1.0"
description = "JChat — 一个具备长期记忆与工作能力的桌面搭子"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["desktop", "companion", "memory", "agent", "pyside6"]
dependencies = [
    "pyside6==6.8.3",
    "openai>=1.30",
    "networkx>=3.0",
    "numpy>=1.24",
    "requests>=2.28",
    "keyboard>=0.13.5",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/JChat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
