<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>JChat Pet (Sprite)</title>
    <style>
        html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
        canvas { display: block; position: absolute; inset: 0; image-rendering: auto; }
        #overlay { position: absolute; inset: 0; display: none; pointer-events: none; }
        #overlay.visible { display: block; }
        #bubbleArea { position: absolute; top: 4px; left: 8px; right: 8px; height: 162px;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        #bubble { display: none; background: #DFF5E1; color: #3A5A40; border-radius: 20px;
            padding: 10px 14px; font-size: 15px; line-height: 1.65;
            font-family: "KaiTi", "楷体", "Microsoft YaHei", "Segoe UI", sans-serif;
            max-height: 140px; overflow-y: auto; pointer-events: auto; }
        #bubble code { background: #FFF6C9; color: #6B5600; border-radius: 4px; padding: 0 4px;
            font-family: Consolas, monospace; }
        #bubble code.blk { display: block; padding: 5px 8px; margin: 4px 0; white-space: pre-wrap; }
        #bubble.visible { display: block; }
        #bubble::-webkit-scrollbar { width: 6px; }
        #bubble::-webkit-scrollbar-track { background: transparent; }
        #bubble::-webkit-scrollbar-thumb { background: #F5C6D9; border-radius: 3px; }
        #bubble::-webkit-scrollbar-thumb:hover { background: #FFB6C9; }
        #bubble .tools { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
        #bubble .toolchip { background: #FFF6C9; color: #8A6D00; border-radius: 12px;
            padding: 2px 10px; font-size: 12px; }
        #bubble .full { display: inline-block; margin-top: 4px; color: #A78BFA;
            font-size: 12px; cursor: pointer; pointer-events: auto; }
        #bubble .output { display: none; background: #FFF6C9; color: #8A6D00; border-radius: 10px;
            padding: 6px 10px; font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
        #inputArea { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            width: 240px; display: flex; gap: 6px; }
        #micBtn { width: 42px; border: 2px solid #FFD9E8; border-radius: 21px; background: #FFFFFF;
            font-size: 16px; cursor: pointer; pointer-events: auto; }
        #micBtn:active { background: #FFE0EC; }
        #micBtn.rec { background: #FFB6C9; border-color: #FF7A9E; color: #B03060; font-size: 13px;
            animation: micpulse 1s ease-in-out infinite; }
        @keyframes micpulse { 50% { transform: scale(1.12); box-shadow: 0 0 8px #FF7A9E; } }
        #chatInput { flex: 1; box-sizing: border-box; background: #FFFFFF; color: #4A3F35;
            border: 2px solid #FFD9E8; border-radius: 22px; padding: 10px 18px; font-size: 14px;
            outline: none; pointer-events: auto; }
        #chatInput:focus { border-color: #FFB6C9; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="overlay">
        <div id="bubbleArea"><div id="bubble"></div></div>
        <div id="inputArea"><button id="micBtn" title="按一下开始录音，再按结束">🎤</button><input id="chatInput" placeholder="说点什么…（Enter 发送）"></div>
    </div>
    <script src="sprite.js"></script>
</body>
</html>
